# Deploy web/ to Vercel on every push to main — uses YOUR Vercel token so
# teammate commits are not blocked by Hobby plan git-author restrictions.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — Vercel account User ID or team ID
#   VERCEL_PROJECT_ID   — Vercel project → Settings → General (prj_…)

name: Deploy frontend (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: vercel-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets
        working-directory: .
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Missing GitHub secret VERCEL_TOKEN — add it at repo Settings → Secrets → Actions"; missing=1; fi
          if [ -z "$VERCEL_ORG_ID" ]; then echo "::error::Missing GitHub secret VERCEL_ORG_ID"; missing=1; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "::error::Missing GitHub secret VERCEL_PROJECT_ID"; missing=1; fi
          exit $missing

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy
        run: vercel deploy --prebuilt --prod
